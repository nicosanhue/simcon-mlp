function tagState(t){
  if(ageH(t.t)>2) return ['off','Sin dato reciente'];
  if(t.num==null) return t.v&&/FUNCIONANDO/.test(t.v)?['ok',t.v]:t.v?['warn',t.v]:['off','Sin valor'];
  const u=t.tag.toUpperCase();
  if(/ALARM|LEAK|FUGA/.test(u)&&!/ACTIVE|WDOG|WD\)/.test(u)) return t.num>=1?['crit','Alarma']:['ok','Normal'];
  if(/\(R\)$/.test(u)&&/PP/.test(u)) return t.num>=1?['ok','En marcha']:['off','Detenida'];
  if(/^370HV\d+\(R\)$/.test(u)) return t.num===1?['ok','Abierta']:t.num===2?['ok','Cerrada']:['warn','Posición '+t.v];
  return ['ok','En línea'];
}

function nodeState(k){
  const tags=D.tags.filter(t=>t.node===k);
  if(tags.some(t=>tagState(t)[0]==='crit')) return 'crit';

  if(tags.length&&tags.every(t=>tagState(t)[0]==='off')) return 'off';
  return 'ok';
}

function Kpis({th,weekly}){

  const p12=D.avisos.filter(hi).length, old=D.avisos.filter(a=>ageD(a.f)>365).length;
  const lib=D.ots.filter(o=>o.st.startsWith('LIB.')).length;
  const w=weekly, n=w.length, last4=w.slice(n-4).reduce((s,x)=>s+x.A1,0), prev4=w.slice(n-8,n-4).reduce((s,x)=>s+x.A1,0);
  const delta=prev4?Math.round((last4-prev4)/prev4*100):0;

    {l:'Tags PI con dato < 2 h',v:`${online}/${D.tags.length}`,d:`${Math.round(online/D.tags.length*100)} % disponibilidad`,c:''},
    {l:'Alarmas activas',v:alarms,d:alarms?'Ver “Requiere atención”':'Sin alarmas',c:alarms?'crit':''},

    {l:'Avisos A1 última semana',v:w.length?w[n-1].A1:0,d:`${delta>0?'+':''}${delta} % últimas 4 sem vs 4 previas`,c:'',spark:['A1',th.s1]},

/* ---------- Requiere atención (exception list) ---------- */
function Attention({onPick}){
  const items=[];
  D.tags.filter(t=>tagState(t)[0]==='crit').forEach(t=>items.push({c:'crit',t:`Alarma: ${t.tag}`,m:`${SHORT[t.node]||t.node} · ${t.sap||t.desc||''}`,k:t.node,tag:t.tag}));
  D.tags.filter(t=>/\(R\)$/.test(t.tag)&&/PP/.test(t.tag)&&tagState(t)[0]==='off'&&ageH(t.t)<=2).forEach(t=>items.push({c:'off',t:`Bomba detenida: ${t.tag.replace('(R)','')}`,m:t.sap,k:t.node,tag:t.tag}));
  D.tags.filter(t=>ageH(t.t)>2).forEach(t=>items.push({c:'off',t:`Sin dato reciente: ${t.tag}`,m:t.t?`Último ${fh(t.t)}`:'Sin registros',k:t.node,tag:t.tag}));
  [...D.avisos].filter(hi).sort((a,b)=>(a.pri+b.f).localeCompare(b.pri+a.f)).slice(0,8).forEach(a=>items.push({c:'warn',t:`Aviso P${a.pri}: ${a.txt}`,m:`${a.id} · ${SHORT[a.node]||'—'} · hace ${ageD(a.f)} d`,k:a.node}));
  return html`<div class="card"><div class="bar"><div><span class="eyebrow">Excepciones</span><h2>Requiere atención</h2></div><span class="pill ${items.some(i=>i.c==='crit')?'p-crit':'p-off'}">${items.length}</span></div>
    <div class="att tscroll" style=${{maxHeight:'430px'}}>${items.map((i,n)=>html`<button key=${n} onClick=${()=>i.k&&onPick(i.k,i.tag)}>
      <span class="dot" style=${{background:`var(--${i.c})`}}></span><span class="t">${i.t}</span><span class="m">${i.m}</span></button>`)}</div></div>`;
}

function eqState(type,t){

  const [st]=tagState(t);
  if(st==='off') return /\(R\)$/.test(t.tag)&&ageH(t.t)<=2?'stop':'off';
  if(st==='crit') return 'crit';
  if(type==='valve') return t.num===1?'open':t.num===2?'closed':'unknown';
  return type==='pump'?'run':'neutral';
}

/* ---------- Station console ---------- */
/* señales discretas (alarmas, (R), estados 0/1/2): se muestran como estado del equipo, no como gráfico */
function isDiscrete(t){
  const u=t.tag.toUpperCase();
  if(/ALARM|LEAK|FUGA|\((R|EST|ACTIVE|WD|LEAKALM|LEAK)\)|_ALARM|LAHH|\(R\)$/.test(u)) return true;
  if(/SOL|TPH|RPM|DAT|\(OUT\)|\(CO\)|\(SP\)/.test(u)) return false;
  if(t.num==null||![0,1,2].includes(t.num)) return false;
  const v=t.s.filter(x=>x!=null); return v.length>0&&v.every(x=>x>=0&&x<=2);
}
function stateChange(t){const v=t.s.filter(x=>x!=null);
  if(!v.length) return 'Sin historial en 48 h';
  const changed=v.some(x=>x!==v[v.length-1]);
  return changed?'Cambió de estado en las últimas 48 h':'Sin cambios en 48 h';}
function stateLabel(t){const [st,lbl]=tagState(t);return lbl==='En línea'?`Señal = ${t.v}`:lbl}

const confLbl={Alta:'código SAP',Media:'mismo lazo',Baja:'por estación','No aplica':'KPI'};

}

        if(tab==='av'){const st=x.st.includes('MEAB')?['p-warn','Abierto']:['p-off','En tratamiento'];
          return html`<div class="item" key=${'a'+x.id}><div class="r1"><span class="id">Aviso ${x.id}</span><span class=${'pill '+st[0]}>${st[1]}</span><span class=${'pill '+(hi(x)?'p-crit':'p-off')}>Prioridad ${x.pri||'–'}</span><span class="pill p-off">${x.tipo}</span></div>
            <div class="txt">${x.txt}</div><div class="meta"><span class="mono">${x.ut}</span><span>${x.utn||x.den}</span><span>${x.f}${d!=null?` · hace ${d} d`:''}</span>${x.ot&&html`<span>OT ${x.ot}</span>`}${x.pt&&html`<span>${x.pt}</span>`}</div></div>`}
        const st=x.st.startsWith('LIB.')?['p-ok','Liberada']:['p-warn','Abierta'], urg=['Urgente','Reparación','Parada de Planta'].includes(x.prit);
        return html`<div class="item" key=${'o'+x.id}><div class="r1"><span class="id">OT ${x.id}</span><span class=${'pill '+st[0]}>${st[1]}</span><span class=${'pill '+(urg?'p-crit':'p-off')}>${x.prit||'Prioridad '+x.pri}</span><span class="pill p-off">${x.cl}</span></div>
          <div class="txt">${x.txt}</div><div class="meta"><span class="mono">${x.ut}</span><span>${x.utn}</span><span>Entrada ${x.f}${x.fi?` · inicio ${x.fi}`:''}</span>${x.av&&html`<span>Aviso ${x.av}</span>`}${x.est?html`<span>Est. ${fmt.format(x.est)}</span>`:null}${x.pt&&html`<span>${x.pt}</span>`}</div></div>`})}
      ${rows.length>limit&&html`<button class="more" onClick=${()=>setLimit(limit+50)}>Mostrar ${Math.min(50,rows.length-limit)} más (quedan ${rows.length-limit})</button>`}`}
    </div></div>`;
}

/* ---------- App ---------- */
function App(){
  const th=useTheme();
  const [sel,setSel]=useState('KM0'),[tagSel,setTagSel]=useState(null);
  const consoleRef=useRef();
  const weekly=useMemo(()=>{const m={};
    D.weekly.av.forEach(([w,t,n])=>{const k=w.slice(0,10);m[k]=m[k]||{w:k,A1:0,A2:0,ot:0};m[k][t]=(m[k][t]||0)+ +n});
    D.weekly.ot.forEach(([w,c,n])=>{const k=w.slice(0,10);m[k]=m[k]||{w:k,A1:0,A2:0,ot:0};m[k].ot+= +n});
    return Object.values(m).filter(r=>(SNAP-new Date(r.w))/864e5>=7).sort((a,b)=>a.w.localeCompare(b.w)).map(r=>({...r,lbl:r.w.slice(8,10)+'/'+r.w.slice(5,7)}))},[]);
  const pick=useCallback((k,tag)=>{if(!info(k))return;setSel(k);setTagSel(tag||null);consoleRef.current&&consoleRef.current.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})},[]);
  const pickNoScroll=useCallback(k=>{if(info(k)){setSel(k);setTagSel(null)}},[]);
  return html`<${React.Fragment}>
    <header class="top"><div class="ttl"><span class="eyebrow">Minera Los Pelambres · Área 370 · Transporte de concentrado</span><h1>Concentraducto 370</h1>
      <span class="muted">Estado de instrumentos PI, ubicaciones técnicas SAP y backlog de mantenimiento</span></div>
      <div class="fresh"><span>PI: <b>${f2(D.snap)}</b></span><span>SAP: <b>${f2(D.sapIng)}</b></span><span>En vivo · PI y SAP desde Databricks</span></div></header>
    <${Kpis} th=${th} weekly=${weekly}/>
    <${Pipeline} sel=${sel} onPick=${pickNoScroll} th=${th}/>
    <div class="grid3"><${Attention} onPick=${pick}/><${Backlog} th=${th} sel=${sel} onPick=${pick}/><${OtHeat} th=${th} onPick=${pick}/></div>
    <${Trend} th=${th} weekly=${weekly}/>
    <section class="console" ref=${consoleRef} style=${{scrollMarginTop:'12px'}}><${TagTable} sel=${sel} th=${th} tagSel=${tagSel} setTagSel=${setTagSel}/><${WorkOrders} sel=${sel}/></section>
    <p class="note">Fuentes: mlp_raw.pi_system_data y pi_system_recorded_data (último valor y promedio horario de 48 h); cruce tag–SAP por código de instrumento; dominio_concentradora.silver_avisos (status MEAB o METR, sin MECE) y silver_ordenes (status ABIE o LIB., sin CTEC ni CERR). Los tags marcados “por estación” no tienen equipo propio en SAP y se asignaron a la estación de su kilómetro. Librerías: React 18 con Recharts (KPIs, backlog, tendencias, detalle de tag), Apache ECharts (mapa de calor de OTs) y D3 (esquema del ducto).</p>
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body></html>
